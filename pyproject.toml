[project]
name = "astrodynamics"
version = "0.1.0"
description = "AstroDynamics Eagle-1: Reinforcement Learning agent for autonomous lunar landing"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Benoit Girard" }]
keywords = [
    "reinforcement-learning",
    "lunar-lander",
    "stable-baselines3",
    "gymnasium",
    "ppo",
    "dqn",
]

dependencies = [
    # Core RL stack — install gymnasium without the `box2d` extra so we avoid
    # the source build of `box2d-py` on Windows; `Box2D` ships prebuilt wheels.
    "gymnasium==1.0.0",
    "Box2D>=2.3.10",
    "pygame>=2.5",
    "stable-baselines3==2.4.0",
    "torch>=2.4,<2.6",
    "numpy>=1.26,<2.2",
    # Data / plotting
    "pandas>=2.2",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "httpx>=0.27",
    # GUI / Dashboard
    "streamlit>=1.39",
    "plotly>=5.24",
    "imageio>=2.36",
    "imageio-ffmpeg>=0.5",
    "pillow>=11.0",
    # Utilities
    "rich>=13.9",
    "tensorboard>=2.18",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.7",
    "bandit>=1.7",
    "pre-commit>=4.0",
    "ipykernel>=6.29",
    "jupyter>=1.1",
    "nbstripout>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# --- uv configuration ---
# We pull torch from the official CUDA 12.4 wheel index to leverage the
# RTX-class GPU available on the training host. CPU-only fall-back is still
# valid because Stable-Baselines3 transparently dispatches to the available
# device.
[tool.uv]
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu124" }]

[tool.hatch.build.targets.wheel]
packages = ["src/astrodynamics"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks/*.ipynb"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501", # line length handled by formatter
    "N812", # capitalized imports (e.g., F = torch.nn.functional)
    "N803", # PEP8 naming for ML conventions (X, y, Q)
    "N806",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["src/astrodynamics"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.bandit]
exclude_dirs = ["tests", "notebooks", ".venv"]
# B101: assert is fine in our scripts/notebooks (used for invariants).
# B311: ``random`` is intentional in RL code (stochastic exploration); never
# used for cryptographic purposes here.
skips = ["B101", "B311"]
