[project]
name = "astrodynamics"
version = "0.1.0"
description = "AstroDynamics Eagle-1: Reinforcement Learning agent for autonomous lunar landing"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Benoit Girard" }]
keywords = [
    "reinforcement-learning",
    "lunar-lander",
    "stable-baselines3",
    "gymnasium",
    "ppo",
    "dqn",
]

dependencies = [
    # Core RL stack — install gymnasium without the `box2d` extra so we avoid
    # the source build of `box2d-py` on Windows; `Box2D` ships prebuilt wheels.
    "gymnasium==1.0.0",
    "Box2D>=2.3.10",
    "pygame>=2.5",
    "stable-baselines3==2.4.0",
    "torch>=2.4,<2.6",
    "numpy>=1.26,<2.2",
    # Data / plotting
    "pandas>=2.2",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "httpx>=0.27",
    # Video
    "imageio>=2.36",
    "imageio-ffmpeg>=0.5",
    "pillow>=11.0",
    # Utilities
    "rich>=13.9",
    "tensorboard>=2.18",
    # TensorBoard still imports `pkg_resources`, which uv does not seed into the
    # virtualenv the way pip-created venvs do. Cap below setuptools 81, which
    # removed `pkg_resources` altogether.
    "setuptools>=70,<81",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# The two Streamlit surfaces, kept out of the default install. They are the only
# consumers of Streamlit, and Streamlit brings pyarrow, which pandas then imports on
# sight -- and on Windows pyarrow's native libraries fault when they load after Box2D.
# The tests passed anyway, but every run printed a Windows access violation, which is
# not something a finished repository should ship. A training and evaluation library
# has no reason to pull a web UI into every install regardless.
ui = [
    "streamlit>=1.39",
    "plotly>=5.24",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.7",
    "bandit[toml]>=1.7",
    "pre-commit>=4.0",
    "ipykernel>=6.29",
    "jupyter>=1.1",
    "nbstripout>=0.7",
    "python-pptx>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# --- uv configuration ---
# DQN trains on the GPU here (measurably: see DQNHyperParameters.device), so torch comes
# from the CUDA index on Windows, where the training host is. The Linux resolution is what
# CI installs, and the runner has no card: pointing it at the CUDA index would download
# about three gigabytes of NVIDIA runtime to run a CPU test suite.
#
# The marker is the platform, not the presence of a card -- uv resolves the lock file ahead
# of time and cannot probe the hardware. On a Linux box with a GPU, swap the two indexes.
[tool.uv]
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform != 'win32'" },
]

[tool.hatch.build.targets.wheel]
packages = ["src/astrodynamics"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks/*.ipynb"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501", # line length handled by formatter
    "N812", # capitalized imports (e.g., F = torch.nn.functional)
    "N803", # PEP8 naming for ML conventions (X, y, Q)
    "N806",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
# Warnings are errors. Three blanket `ignore::` lines used to hide every DeprecationWarning
# and UserWarning in the project, our own included -- which is how a deprecated Gymnasium
# call goes unnoticed until it is removed. Each exemption below names what it silences and
# comes from a dependency, not from this code.
filterwarnings = [
    "error",
    # SWIG 4.2 emits these while Box2D's extension module is being imported. Raising there
    # unwinds through C and takes the interpreter down with it, so it cannot be an error.
    "ignore:builtin type Swig.* has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
    # pygame still imports pkg_resources at module load; nothing here can avoid it.
    "ignore:pkg_resources is deprecated as an API:UserWarning",
]

[tool.coverage.run]
source = ["src/astrodynamics"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.bandit]
exclude_dirs = ["tests", "notebooks", ".venv"]
# B101: assert is fine in our scripts/notebooks (used for invariants).
# B311: ``random`` is intentional in RL code (stochastic exploration); never
# used for cryptographic purposes here.
skips = ["B101", "B311"]
