name: CI

# No `schedule` trigger: training is not run here, only the checks below.
# No automatic trigger after 2026-09-18. The green pass is in the tab.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Set up Python
        run: uv python install 3.12

      # Resolves to the +cpu torch wheels here — see the index markers in pyproject.toml.
      # The runner has no GPU, and the CUDA build would add about three gigabytes.
      - name: Sync dependencies
        # `ui` too: tests/integration/test_streamlit_pages.py is the only thing that runs
        # the two pages, and without Streamlit it cannot even be collected. The extra is
        # kept out of the default install for a Windows reason that no runner has.
        run: uv sync --frozen --extra dev --extra ui

      # Checks only. Nothing in this job writes to the checkout.
      - name: Ruff
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Bandit
        run: uv run python -m bandit -c pyproject.toml -r src scripts

      # The suite trains throwaway policies for a few thousand steps on CPU. It does read
      # the published artefacts -- data/*.csv, data/*.json and models/ppo/best.zip are
      # tracked -- because the tests that matter most assert those are consistent.
      #
      # SDL_VIDEODRIVER=dummy: the recorder tests render frames through pygame. Gymnasium
      # only opens a window for render_mode="human", but pygame still initialises SDL, and
      # a runner has no display for it to find.
      - name: Pytest
        env:
          SDL_VIDEODRIVER: dummy
        run: uv run python -m pytest
