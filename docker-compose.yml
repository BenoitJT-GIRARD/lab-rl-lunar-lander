services:
  api:
    build: .
    container_name: rl-lander-api
    ports:
      - "8000:8000"

  dashboard:
    build: .
    container_name: rl-lander-dashboard
    ports:
      - "8501:8501"
    command:
      - streamlit
      - run
      - src/rl_lander/dashboard.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
    # Streamlit's own probe, not the API's: this container serves a page and no /health.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=2)
      interval: 30s
      timeout: 3s
      start_period: 30s
      retries: 3
    # The page reads what the API serves from, and nothing it shows comes from the API. It
    # still waits: two surfaces of one run, started together, tell one story.
    depends_on:
      api:
        condition: service_healthy
